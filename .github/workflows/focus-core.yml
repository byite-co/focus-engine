name: focus-core

on:
  push:
    paths:
      - "core/focus-core/**"
      - ".github/workflows/focus-core.yml"
  pull_request:
    paths:
      - "core/focus-core/**"
      - ".github/workflows/focus-core.yml"

jobs:
  test:
    name: focus-core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/focus-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the pure-logic core
        run: ./gradlew :focus-core:test --no-daemon --console=plain

      - name: Build and test the gt-diff CLI
        run: ./gradlew :gt-diff:test :gt-diff:installDist --no-daemon --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focus-core-test-reports
          path: |
            core/focus-core/focus-core/build/reports/tests
            core/focus-core/gt-diff/build/reports/tests
          if-no-files-found: ignore
