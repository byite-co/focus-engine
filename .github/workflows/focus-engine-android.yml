name: focus-engine-android

# pull_request: 단위 테스트(:engine JVM, focus-core 는 composite build 로 함께 컴파일) + assembleDebug +
# merged manifest 에 INTERNET 이 없는지 검사. 업로드 없음.
# main 푸시(android/focus-engine/** 또는 core/focus-core/** 변경)와 수동 실행(workflow_dispatch): 빌드 뒤
# prerelease `focus-engine-dev-latest` 를 만들거나 갱신하고 APK 를 올린다(spike-r1 과 같은 방식).
on:
  pull_request:
    paths:
      - 'android/focus-engine/**'
      - 'core/focus-core/**'
      - '.github/workflows/focus-engine-android.yml'
  push:
    branches: [main]
    paths:
      - 'android/focus-engine/**'
      - 'core/focus-core/**'
      - '.github/workflows/focus-engine-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focus-engine-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: unit tests + assembleDebug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/focus-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Unit tests (engine JVM: pure logic + data boundary)
        run: ./gradlew :engine:testDebugUnitTest --console=plain

      - name: assembleDebug
        run: ./gradlew :devapp:assembleDebug --console=plain

      # 데이터 경계: 어떤 의존성이 가져오더라도 최종 APK 매니페스트에 네트워크 권한이 없어야 한다.
      - name: Verify merged manifest has no network permission
        shell: bash
        run: |
          set -euo pipefail
          M="$(find devapp/build/intermediates -path '*merged_manifests*' -name AndroidManifest.xml | head -1)"
          test -n "$M" || { echo "::error::merged manifest not found"; exit 1; }
          echo "merged manifest: $M"
          if grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' "$M"; then
            echo "::error::network permission present in the merged manifest"
            exit 1
          fi
          echo "OK: no INTERNET / ACCESS_NETWORK_STATE in $M"
          grep -o 'android:name="android.permission.[A-Z_]*"' "$M" | sort -u

      - name: Verify model assets are the pinned files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'SUMS'
          64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff  engine/src/main/assets/face_landmarker.task
          59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a  engine/src/main/assets/pose_landmarker_lite.task
          SUMS

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focus-engine-test-reports
          path: android/focus-engine/engine/build/reports/tests
          if-no-files-found: ignore

      # rolling prerelease. 태그 focus-engine-dev-latest 를 이번 커밋으로 옮기고, 이전 APK 자산을 지운 뒤
      # 새 APK(파일명에 짧은 커밋 해시)를 올린다. 디버그 서명 키는 러너마다 새로 만들어져 빌드마다 다르다.
      - name: Publish APK to prerelease focus-engine-dev-latest
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: focus-engine-dev-latest
        run: |
          set -euo pipefail
          SHA7="${GITHUB_SHA:0:7}"
          APK="focus-engine-dev-debug-${SHA7}.apk"
          cp devapp/build/outputs/apk/debug/devapp-debug.apk "$APK"

          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

          NOTES="$(cat <<NOTES_EOF
          focus-engine 개발용 앱(devapp) 디버그 APK. 매 빌드마다 이 prerelease 의 태그와 APK 가 갱신된다.

          - commit: ${GITHUB_SHA} (${GITHUB_REF_NAME})
          - run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - built: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          설치: 디버그 서명 키가 빌드마다 달라서 재설치 전에 기존 앱을 지운다. 앱을 지우면 세션 로그도 같이
          지워지므로 먼저 adb pull 한다.

              adb pull /sdcard/Android/data/co.byite.focus.devapp/files/focus-engine/ ./focus-engine-logs/
              adb uninstall co.byite.focus.devapp
              adb install ${APK}
          NOTES_EOF
          )"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "focus-engine dev latest (${SHA7})" --notes "$NOTES"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep -E '^focus-engine-dev-debug-.*\.apk$' | grep -vx "$APK" \
              | while read -r old; do
                  gh release delete-asset "$TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes
                done
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "focus-engine dev latest (${SHA7})" --notes "$NOTES"
          fi
          gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          echo "published $APK to release $TAG"
